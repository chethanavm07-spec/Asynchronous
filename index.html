<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Weather Dashboard</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            text-align: center;
        }

        h1 {
            color: #1769e0;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 25px;
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        .search-box input {
            flex: 1;
            padding: 14px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
        }

        .search-box input:focus {
            border-color: #1769e0;
        }

        .search-box button {
            padding: 14px 20px;
            border: none;
            background: #1769e0;
            color: white;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
        }

        .search-box button:hover {
            background: #0d52b5;
        }

        #loading {
            display: none;
            color: #1769e0;
            margin: 15px;
        }

        #error {
            display: none;
            color: #d32f2f;
            background: #ffebee;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .weather-card {
            display: none;
            background: linear-gradient(135deg, #e3f2fd, #ffffff);
            padding: 25px;
            border-radius: 15px;
        }

        .city {
            font-size: 28px;
            font-weight: bold;
            color: #222;
            margin-bottom: 10px;
        }

        .temperature {
            font-size: 55px;
            font-weight: bold;
            color: #1769e0;
            margin: 10px 0;
        }

        .weather-description {
            font-size: 18px;
            color: #555;
            margin-bottom: 20px;
        }

        .weather-details {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .detail {
            background: white;
            padding: 15px 5px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .detail-icon {
            font-size: 25px;
            margin-bottom: 8px;
        }

        .detail-title {
            font-size: 13px;
            color: #777;
        }

        .detail-value {
            font-size: 17px;
            font-weight: bold;
            color: #333;
            margin-top: 5px;
        }

        .time {
            margin-top: 20px;
            color: #777;
            font-size: 14px;
        }

        footer {
            margin-top: 20px;
            color: #888;
            font-size: 12px;
        }

        @media (max-width: 450px) {
            .container {
                padding: 20px;
            }

            .weather-details {
                grid-template-columns: 1fr;
            }

            .temperature {
                font-size: 45px;
            }
        }
    </style>
</head>

<body>

        <h1>🌤️ Weather Dashboard</h1>

        <p class="subtitle">
            Search for real-time weather information
